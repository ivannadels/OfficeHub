{% extends "base.html" %}
{% block title %}Time Tracker · OfficeHub{% endblock %}

{% block content %}
<h1 class="page-title">Time Tracker</h1>

<div class="mode-toggle">
  <button class="btn btn-primary">Manual Entry</button>
  <button class="btn btn-secondary">🎤 Voice Memo</button>
</div>

<div class="table-card">
  <table class="tracker">
    <thead>
      <tr>
        <th>Date</th>
        <th>Purpose</th>
        <th>Case</th>
        <th>Time</th>
        <th>Notes</th>
        <th colspan="3" class="menu-cell">
          <button class="menu-btn" title="Options"><span></span><span></span><span></span></button>
        </th>
      </tr>
    </thead>
    <tbody>
      {% for e in entries %}
      <tr>
        <td><span class="pill">{{ e.date }}</span></td>
        <td>{{ e.purpose }}</td>
        <td>
          <select class="pill pill-select">
            {% for opt in case_options %}
            <option {{ 'selected' if opt == e.case }}>{{ opt }}</option>
            {% endfor %}
          </select>
        </td>
        <td class="time">{{ e.time }}</td>
        <td class="notes">{{ e.notes }}</td>
        <td class="action"><button class="btn-memo">Memo &rarr;</button></td>
        <td class="action">
          <button class="icon-btn" title="Email">
            <svg viewBox="0 0 48 34" fill="#fff" stroke="#000" stroke-width="2.2" stroke-linejoin="round"><rect x="1.5" y="1.5" width="45" height="31" rx="2"/><path d="M1.5 1.5L24 20 46.5 1.5M1.5 32.5L19 16M46.5 32.5L29 16" fill="none"/></svg>
          </button>
        </td>
        <td class="action">
          <button class="icon-btn" title="Add to calendar">
            <svg viewBox="0 0 40 42" fill="none" stroke="#000" stroke-width="1.8">
              <rect x="1.5" y="4" width="37" height="36" rx="4" fill="#fff"/>
              <path d="M1.5 12h37"/>
              <path d="M6 1v6M9 1v6M12 1v6M15 1v6M18 1v6M21 1v6M24 1v6M27 1v6M30 1v6M33 1v6" stroke-width="1.4"/>
              <g fill="#000" stroke="none">
                {% for row in range(4) %}{% for col in range(6) %}
                <rect x="{{ 6 + col * 5 }}" y="{{ 17 + row * 5.5 }}" width="2.4" height="2.4"/>
                {% endfor %}{% endfor %}
              </g>
            </svg>
          </button>
        </td>
      </tr>
      {% endfor %}
      <tr class="add-row">
        <td colspan="8">
          <button class="pill add-pill" title="Add entry">
            <img src="{{ url_for('static', filename='img/calendar.svg') }}" alt="">
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
{% endblock %}
